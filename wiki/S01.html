<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>晶片與半導體基礎｜半導體 LLM Wiki</title><style>body{margin:0;background:#08111f;color:#eaf4fb;font:17px/1.8 system-ui,"Noto Sans TC",sans-serif}main{max-width:800px;padding:24px;margin:5vh auto}a{color:#60e2cb}article{background:#112338;border:1px solid #294057;padding:30px;border-radius:20px}h1{line-height:1.3}h2{color:#60e2cb}small{color:#a7bbce}footer{margin-top:30px}</style></head><body><main><p><a href="../index.html">← Wiki 首頁</a> · <a href="../slides/">教學簡報</a></p><article><small>S01 · 基礎</small><h1>晶片與半導體基礎</h1><h2>重點摘要</h2><p>矽是一種半導體，可以透過摻入其他元素調整其導電特性；積體電路是由大量電晶體及連線構成。</p><h2>初學者解釋</h2><p>晶片不是一塊單純的金屬，而是用可控制電性的材料製成的複雜電路。</p><h2>來源與查核</h2><p>ASML · The basics of microchips</p><a href="https://www.asml.com/en/technology/all-about-microchips/microchip-basics" target="_blank" rel="noopener noreferrer">查看官方來源</a><p><small>查核日期：2026-11-22 · 人工摘要，非原文全文轉載</small></p></article><footer><a href="../index.html">返回 Wiki 知識庫</a></footer></main></body></html>
